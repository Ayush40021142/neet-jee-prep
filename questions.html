<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEET Biology Practice | PrepRise</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      color: #2563eb;
      font-size: 24px;
      font-weight: 800;
    }

    .test-info {
      color: #64748b;
      font-size: 14px;
    }

    .container {
      max-width: 950px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .top-card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .progress-bar {
      width: 100%;
      height: 9px;
      background: #e5e7eb;
      border-radius: 20px;
      margin-top: 15px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 20%;
      background: #2563eb;
      transition: 0.3s;
    }

    .question-card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.06);
    }

    .question-number {
      color: #2563eb;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .question {
      font-size: 21px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .option {
      border: 2px solid #e5e7eb;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .option:hover {
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .option.selected {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .option.correct {
      border-color: #16a34a;
      background: #dcfce7;
    }

    .option.wrong {
      border-color: #dc2626;
      background: #fee2e2;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      gap: 10px;
    }

    button {
      border: none;
      padding: 13px 22px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #334155;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .explanation {
      display: none;
      margin-top: 22px;
      padding: 18px;
      background: #f0fdf4;
      border-left: 4px solid #16a34a;
      border-radius: 8px;
      line-height: 1.6;
    }

    .result {
      display: none;
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.06);
    }

    .score {
      font-size: 52px;
      font-weight: 800;
      color: #2563eb;
      margin: 20px 0;
    }

    .result p {
      color: #64748b;
      margin: 8px 0;
    }

    .restart {
      margin-top: 20px;
    }

    @media(max-width:600px) {
      .question-card {
        padding: 20px;
      }

      .question {
        font-size: 18px;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">PrepRise</div>

  <div class="test-info">
    NEET Biology • Practice
  </div>
</header>

<div class="container">

  <div class="top-card">
    <strong id="progressText">Question 1 of 5</strong>

    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>
  </div>

  <div class="question-card" id="questionCard">

    <div class="question-number" id="questionNumber">
      Question 1
    </div>

    <div class="question" id="question">
      Loading question...
    </div>

    <div id="options"></div>

    <div class="explanation" id="explanation"></div>

    <div class="actions">

      <button
        class="secondary"
        id="previousBtn"
        onclick="previousQuestion()">
        ← Previous
      </button>

      <button
        class="primary"
        id="checkBtn"
        onclick="checkAnswer()">
        Check Answer
      </button>

      <button
        class="primary"
        id="nextBtn"
        onclick="nextQuestion()"
        style="display:none;">
        Next →
      </button>

    </div>

  </div>

  <div class="result" id="result">

    <h2>Test Completed 🎉</h2>

    <div class="score" id="score">
      0/5
    </div>

    <p id="correctText"></p>
    <p id="wrongText"></p>

    <button
      class="primary restart"
      onclick="restartTest()">
      Try Again
    </button>

  </div>

</div>


<script>



const SUPABASE_URL = "https://pkhywkkcvzfcpqxkmbbf.supabase.co";
const SUPABASE_KEY = "sb_publishable_D02iAMs301aETaagSP48rQ_qR1pMZ5S";

const TEST_TITLE = "NEET Biology Starter Test";

let questions = [];
let currentQuestion = 0;
let selectedAnswer = null;
let userAnswers = [];
let timeLeft = 30 * 60;
let timerInterval = null;

function startTimer() {

  if (timerInterval) {
    clearInterval(timerInterval);
  }

  const timer = document.createElement("div");

  timer.id = "examTimer";

  timer.style.cssText = `
    position: fixed;
    top: 15px;
    right: 20px;
    background: #2563eb;
    color: white;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    z-index: 9999;
  `;

  timer.innerText = "Time: 30:00";

  document.body.appendChild(timer);

  timerInterval = setInterval(() => {

    timeLeft--;

    const minutes =
      Math.floor(timeLeft / 60);

    const seconds =
      timeLeft % 60;

    timer.innerText =
      "Time: " +
      String(minutes).padStart(2, "0") +
      ":" +
      String(seconds).padStart(2, "0");

    if (timeLeft <= 0) {

      clearInterval(timerInterval);

      alert("Time is over! Test submitted.");

      showResult();
    }

  }, 1000);
}

async function getData(url) {

  const response = await fetch(url, {
    method: "GET",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    }
  });

  if (!response.ok) {
    const errorText = await response.text();
    throw new Error(
      "Supabase error " +
      response.status +
      ": " +
      errorText
    );
  }

  return await response.json();
}


async function startTest() {

  try {

    // Get all tests
    const tests = await getData(
      SUPABASE_URL +
      "/rest/v1/tests?select=*"
    );

    // Find our test
    const test = tests.find(
      t => t.title === TEST_TITLE
    );

    if (!test) {
      throw new Error(
        "NEET Biology Starter Test nahi mila."
      );
    }


    // Get all test-question links
    const allTestQuestions = await getData(
      SUPABASE_URL +
      "/rest/v1/test_questions?select=*"
    );

    // Keep only questions belonging to our test
    const testQuestions =
      allTestQuestions
        .filter(tq =>
          String(tq.test_id) === String(test.id)
        )
        .sort(
          (a, b) =>
            a.question_number - b.question_number
        );


    if (!testQuestions.length) {
      throw new Error(
        "Is test ke saath koi question connected nahi hai."
      );
    }


    // Get all questions
    const allQuestions = await getData(
      SUPABASE_URL +
      "/rest/v1/questions?select=*"
    );


    // Build final question list
    questions = testQuestions
      .map(tq => {

        const q = allQuestions.find(
          item =>
            String(item.id) ===
            String(tq.question_id)
        );

        if (!q) return null;

        return {
          id: q.id,

          question:
            q.question || q.question_text,

          options: [
            q.option_a,
            q.option_b,
            q.option_c,
            q.option_d
          ],

          answer:
            convertAnswer(q.correct_answer),

          explanation:
            q.explanation ||
            "Explanation available nahi hai."
        };

      })
      .filter(Boolean);


    if (!questions.length) {
      throw new Error(
        "Questions database se nahi mil rahe."
      );
    }


    userAnswers =
      new Array(questions.length).fill(null);

    loadQuestion();


  } catch (error) {

    console.error(error);

    document.getElementById("question").innerText =
      "Database se question load nahi hua.";

    document.getElementById("options").innerHTML =
      "<div style='color:red; padding:10px;'>" +
      error.message +
      "</div>";

  }

}


function convertAnswer(answer) {

  if (answer === null || answer === undefined) {
    return 0;
  }

  const value =
    String(answer).trim().toUpperCase();

  if (value === "A") return 0;
  if (value === "B") return 1;
  if (value === "C") return 2;
  if (value === "D") return 3;

  // Agar database mein 1,2,3,4 stored hai
  if (value === "1") return 0;
  if (value === "2") return 1;
  if (value === "3") return 2;
  if (value === "4") return 3;

  // Agar database mein 0,1,2,3 stored hai
  if (value === "0") return 0;

  return 0;
}


function loadQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("questionNumber").innerText =
    "Question " + (currentQuestion + 1);

  document.getElementById("progressText").innerText =
    "Question " +
    (currentQuestion + 1) +
    " of " +
    questions.length;

  document.getElementById("question").innerText =
    q.question;

  document.getElementById("progress").style.width =
    ((currentQuestion + 1) /
      questions.length * 100) + "%";


  const optionsContainer =
    document.getElementById("options");

  optionsContainer.innerHTML = "";


  q.options.forEach((option, index) => {

    const div =
      document.createElement("div");

    div.className = "option";

    div.innerText =
      String.fromCharCode(65 + index) +
      ". " +
      option;

    div.onclick = function() {
      selectOption(index);
    };

    optionsContainer.appendChild(div);

  });


  selectedAnswer =
    userAnswers[currentQuestion] ?? null;


  if (selectedAnswer !== null) {

    const options =
      document.querySelectorAll(".option");

    options[selectedAnswer]
      .classList.add("selected");

  }


  document.getElementById("explanation")
    .style.display = "none";

  document.getElementById("checkBtn")
    .style.display = "inline-block";

  document.getElementById("nextBtn")
    .style.display = "none";

  document.getElementById("previousBtn")
    .disabled =
    currentQuestion === 0;

}


function selectOption(index) {

  selectedAnswer = index;

  const options =
    document.querySelectorAll(".option");

  options.forEach(option => {
    option.classList.remove("selected");
  });

  options[index].classList.add("selected");

}


function checkAnswer() {

  if (selectedAnswer === null) {

    alert("Please select an answer first.");

    return;
  }


  userAnswers[currentQuestion] =
    selectedAnswer;

  const q = questions[currentQuestion];

  const options =
    document.querySelectorAll(".option");


  options.forEach((option, index) => {

    option.onclick = null;

    if (index === q.answer) {
      option.classList.add("correct");
    }

    if (
      index === selectedAnswer &&
      selectedAnswer !== q.answer
    ) {
      option.classList.add("wrong");
    }

  });


  const explanation =
    document.getElementById("explanation");

  explanation.innerHTML =
    "<strong>Explanation:</strong><br>" +
    q.explanation;

  explanation.style.display =
    "block";


  document.getElementById("checkBtn")
    .style.display = "none";

  document.getElementById("nextBtn")
    .style.display = "inline-block";

}


function nextQuestion() {

  if (
    currentQuestion <
    questions.length - 1
  ) {

    currentQuestion++;

    loadQuestion();

  } else {

    showResult();

  }

}


function previousQuestion() {

  if (currentQuestion > 0) {

    currentQuestion--;

    loadQuestion();

  }

}


function showResult() {

  let correct = 0;
  let wrong = 0;

  userAnswers.forEach(
    (answer, index) => {

      if (answer === null) return;

      if (
        answer ===
        questions[index].answer
      ) {
        correct++;
      } else {
        wrong++;
      }

    }
  );


  document.getElementById("questionCard")
    .style.display = "none";

  document.querySelector(".top-card")
    .style.display = "none";

  document.getElementById("result")
    .style.display = "block";


  document.getElementById("score")
    .innerText =
    correct + "/" + questions.length;

  document.getElementById("correctText")
    .innerText =
    "Correct answers: " + correct;

  document.getElementById("wrongText")
    .innerText =
    "Incorrect answers: " + wrong;

}


function restartTest() {

  currentQuestion = 0;

  selectedAnswer = null;

  userAnswers =
    new Array(questions.length)
      .fill(null);

  document.getElementById("result")
    .style.display = "none";

  document.getElementById("questionCard")
    .style.display = "block";

  document.querySelector(".top-card")
    .style.display = "block";

  loadQuestion();
startTimer();
}


// Start
startTest();

</script>



</body>
</html>
